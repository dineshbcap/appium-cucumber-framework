# Self-healing locator configuration (com.dinesh.healing / HealingSupport).
# Every key can be overridden per-run with a -D system property,
# e.g. mvn test -Dhealing.failOnHeal=true
#
# Deliberately named "healing-config.properties" rather than the library's own
# bundled "healing.properties" so classpath resource lookup can't accidentally
# pick up the library's copy instead of this project's.

# Master switch for the entire healing layer. When false, a broken locator
# fails immediately instead of attempting to heal.
healing.enabled=true

# When true, a successful heal still fails the step with HealedLocatorException —
# use this on PR-gate jobs so a heal is visible/actionable, not silently swallowed.
# Recommended: false for nightly regression, true for PR-gate jobs.
healing.failOnHeal=false

# Persistence locations (created if missing).
# Cache lives outside target/ deliberately — it's keyed by app.build.id so a
# stale entry from a different build is never trusted, but an `mvn clean`
# against the SAME build shouldn't force every healed locator (LLM calls
# included) to be re-discovered. The report, by contrast, is a fresh per-run
# summary like every other target/ report (Extent, Cucumber, Allure), so it
# stays there and gets wiped on clean same as they do.
healing.cache.file=.healing-cache/healing-cache.json
healing.report.file=target/healing-report.json

# ---- Phase 2 (LLM) — wired via HealingSupport (LlmHealingEngineFactory), only ----
# ---- consulted as a fallback after DeterministicHealer's heuristics fail ----
# healing.llm.provider picks the engine the factory builds: anthropic (default) |
# ollama | vastai. Switching providers is a config change, not a code change — or
# override per-run without touching this file: mvn test -Dhealing.llm.provider=ollama
# An unknown provider, or healing.llm.enabled=false, degrades to NO_OP (logged as a
# warning) — it never breaks the suite.
healing.llm.enabled=true
healing.llm.provider=ollama
healing.llm.confidence.threshold=0.7
healing.llm.timeoutSeconds=200
healing.llm.maxPageSourceChars=60000

# provider: anthropic — requires the env var named by healing.llm.apiKeyEnv to be
# set in the shell that runs the tests; if it's unset/blank, LLM heals are skipped
# (logged as a warning) and deterministic-only healing continues unaffected.
healing.llm.model=claude-sonnet-4-6
healing.llm.apiKeyEnv=ANTHROPIC_API_KEY

# provider: ollama — local model, nothing leaves the machine/network. Requires
# Ollama installed and the model pulled: `ollama pull llama3.1`.
# numCtx: Ollama silently defaults new sessions to 4096 tokens regardless of the
# model's real context length, forcing an expensive context-shift once the prompt
# (dominated by the pruned page source) exceeds it — this is what was causing the
# HttpTimeoutException even at timeoutSeconds=200. 8192 is a safe default for a
# 16GB machine; raise it (uses more RAM) if you have headroom and still see
# timeouts with very large page sources relative to maxPageSourceChars above.
healing.llm.ollama.baseUrl=http://localhost:11434
healing.llm.ollama.model=qwen3:8b
healing.llm.ollama.numCtx=8192

# provider: vastai — self-hosted OpenAI-compatible endpoint (e.g. rented GPU
# capacity). No default baseUrl — must point at your own instance.
#healing.llm.vastai.baseUrl=http://<instance-ip>:8000/v1
#healing.llm.vastai.model=meta-llama/Llama-3.1-70B-Instruct
#healing.llm.vastai.apiKeyEnv=VASTAI_API_KEY
